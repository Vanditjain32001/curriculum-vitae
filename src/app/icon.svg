<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1220" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>
    <linearGradient id="jGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Borderless Dark Rounded Squircle with 100% transparent outer canvas -->
  <rect x="0" y="0" width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Centered Bold VJ Only (No dot, No boundaries) -->
  <g transform="translate(256, 350)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="300" font-weight="900" letter-spacing="-12">
    <text x="-80" y="0" text-anchor="middle" fill="#ffffff">V</text>
    <text x="80" y="0" text-anchor="middle" fill="url(#jGrad)">J</text>
  </g>
</svg>
